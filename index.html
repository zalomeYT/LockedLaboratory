<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор QR-кодов</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
</head>
<body>

    <h1>Генератор QR-кодов</h1>
    <input type="text" id="qrInput" placeholder="Введите текст или URL" />
    <button id="generateBtn">Сгенерировать QR-код</button>

    <canvas id="qrCanvas"></canvas>

    <script>
        document.getElementById('generateBtn').addEventListener('click', function() {
            var qr = new QRious({
                element: document.getElementById('qrCanvas'),
                value: document.getElementById('qrInput').value,
                size: 200 // Размер QR-кода
            });
        });
    </script>

</body>
</html>
